# SonarQube Cloud : analyse lancée par la CI (job "sonar"), avec la couverture des tests.
sonar.projectKey=MoadAbdel_lafoulee
sonar.organization=moadabdel
sonar.projectName=lafoulee

# Code de production et tests séparés.
sonar.sources=apps/api/src,apps/web,packages/shared/src
sonar.tests=apps/api/test,apps/api/src,apps/web,packages/shared/src
sonar.test.inclusions=apps/api/test/**,**/*.test.ts,**/*.test.tsx,**/*.spec.ts,apps/web/e2e/**,apps/web/test-utils/**
sonar.exclusions=**/node_modules/**,**/.next/**,**/dist/**,**/coverage/**,apps/api/src/generated/**,apps/web/e2e/**,apps/web/test-utils/**,**/*.test.ts,**/*.test.tsx,**/*.spec.ts

# Couverture : rapports lcov des jobs test-api et test-web (chemins ramenés à la racine du dépôt).
sonar.javascript.lcov.reportPaths=apps/api/coverage/lcov.info,apps/web/coverage/lcov.info
# Mêmes exclusions que les seuils de couverture de Vitest : fichiers sans logique à tester.
sonar.coverage.exclusions=**/*.config.*,apps/api/src/main.ts,apps/api/prisma/**,apps/api/scripts/**,apps/web/next.config.ts,apps/web/playwright.config.ts
