name: CI
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: npm }
      - run: npm ci --ignore-scripts # aucun script d'installation par défaut...
      - run: npm rebuild esbuild prisma @prisma/engines # ...sauf les 3 paquets approuvés
      - run: npm run build -w @lafoulee/shared
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm audit --audit-level=high

  test-api:
    needs: quality
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env: { POSTGRES_USER: test, POSTGRES_PASSWORD: test, POSTGRES_DB: test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test" --health-interval 5s --health-retries 10
      redis:
        image: redis:8-alpine
        ports: ["6379:6379"]
      redis-http: # émule l'API REST d'Upstash
        image: hiett/serverless-redis-http:0.0.10@sha256:65128347949bca511e448fd7238780d624573d74c22b79155a7563db19e9b678
        env:
          SRH_MODE: env
          SRH_TOKEN: test_token
          SRH_CONNECTION_STRING: redis://redis:6379
        ports: ["8079:80"]
    env:
      # Valeurs de test uniquement : l'API refuse de démarrer sans elles.
      NODE_ENV: test
      DATABASE_URL: postgresql://test:test@localhost:5432/test
      UPSTASH_REDIS_REST_URL: http://localhost:8079
      UPSTASH_REDIS_REST_TOKEN: test_token
      CRON_SECRET: ci-cron-secret-0123456789
      STRIPE_SECRET_KEY: sk_test_ci_factice # Stripe est remplacé par une fausse passerelle dans les tests
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: npm }
      - run: npm ci --ignore-scripts # aucun script d'installation par défaut...
      - run: npm rebuild esbuild prisma @prisma/engines # ...sauf les 3 paquets approuvés
      - run: npm run build -w @lafoulee/shared
      - name: Clés de test éphémères (JWT ES256, chiffrement TOTP)
        run: |
          node -e '
          const c = require("node:crypto");
          const { privateKey, publicKey } = c.generateKeyPairSync("ec", { namedCurve: "P-256" });
          const b = (s) => Buffer.from(s).toString("base64");
          console.log("JWT_PRIVATE_KEY_B64=" + b(privateKey.export({ type: "pkcs8", format: "pem" })));
          console.log("JWT_PUBLIC_KEY_B64=" + b(publicKey.export({ type: "spki", format: "pem" })));
          console.log("TOTP_ENC_KEY=" + c.randomBytes(32).toString("base64"));
          ' >> "$GITHUB_ENV"
      - run: npm run db:generate -w apps/api
      - run: npm run db:deploy -w apps/api
      - run: npm run db:seed -w apps/api
      - run: npm run test:cov -w apps/api # unitaires + e2e, seuil de couverture 60 %
      - name: Rapport de couverture pour SonarQube (chemins depuis la racine du dépôt)
        run: sed -i 's#^SF:#SF:apps/api/#' apps/api/coverage/lcov.info
      - uses: actions/upload-artifact@v7
        with: { name: couverture-api, path: apps/api/coverage/lcov.info, retention-days: 7 }

  test-web:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: npm }
      - run: npm ci --ignore-scripts # aucun script d'installation par défaut...
      - run: npm rebuild esbuild prisma @prisma/engines # ...sauf les 3 paquets approuvés
      - run: npm run build -w @lafoulee/shared
      - run: npm run test:cov -w apps/web # seuil de couverture 60 %
      - name: Rapport de couverture pour SonarQube (chemins depuis la racine du dépôt)
        run: sed -i 's#^SF:#SF:apps/web/#' apps/web/coverage/lcov.info
      - uses: actions/upload-artifact@v7
        with: { name: couverture-web, path: apps/web/coverage/lcov.info, retention-days: 7 }

  # Analyse SonarQube Cloud avec la couverture des tests (l'analyse automatique ne la lit pas).
  sonar:
    needs: [test-api, test-web]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 } # historique complet : Sonar repère le nouveau code
      - uses: actions/download-artifact@v8
        with: { name: couverture-api, path: apps/api/coverage }
      - uses: actions/download-artifact@v8
        with: { name: couverture-web, path: apps/web/coverage }
      - uses: SonarSource/sonarqube-scan-action@70bad232163b09d998ea0707ee80c0ec80798c16 # v8.5.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  build-web:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: npm }
      - run: npm ci --ignore-scripts # aucun script d'installation par défaut...
      - run: npm rebuild esbuild prisma @prisma/engines # ...sauf les 3 paquets approuvés
      # L'API est volontairement injoignable : le build ne doit jamais l'appeler.
      - run: npm run build -w apps/web
        env: { API_INTERNAL_URL: "http://127.0.0.1:1" }

  # Parcours réels dans un navigateur : API + site lancés sur des services éphémères.
  e2e:
    needs: quality
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env: { POSTGRES_USER: test, POSTGRES_PASSWORD: test, POSTGRES_DB: test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test" --health-interval 5s --health-retries 10
      redis:
        image: redis:8-alpine
        ports: ["6379:6379"]
      redis-http:
        image: hiett/serverless-redis-http:0.0.10@sha256:65128347949bca511e448fd7238780d624573d74c22b79155a7563db19e9b678
        env:
          SRH_MODE: env
          SRH_TOKEN: test_token
          SRH_CONNECTION_STRING: redis://redis:6379
        ports: ["8079:80"]
    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/test
      UPSTASH_REDIS_REST_URL: http://localhost:8079
      UPSTASH_REDIS_REST_TOKEN: test_token
      CRON_SECRET: ci-cron-secret-0123456789
      # Vraie clé Stripe de test si le secret existe (TE01 va jusqu'au paiement), sinon TE01 est sauté.
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY_TEST || 'sk_test_ci_factice' }}
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.STRIPE_PUBLISHABLE_KEY_TEST }}
      E2E_STRIPE: ${{ secrets.STRIPE_SECRET_KEY_TEST != '' && '1' || '' }}
      API_DEV_URL: http://localhost:4000
      BASE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: npm }
      - run: npm ci --ignore-scripts # aucun script d'installation par défaut...
      - run: npm rebuild esbuild prisma @prisma/engines # ...sauf les 3 paquets approuvés
      - name: Clés de test éphémères
        run: |
          node -e '
          const c = require("node:crypto");
          const { privateKey, publicKey } = c.generateKeyPairSync("ec", { namedCurve: "P-256" });
          const b = (s) => Buffer.from(s).toString("base64");
          console.log("JWT_PRIVATE_KEY_B64=" + b(privateKey.export({ type: "pkcs8", format: "pem" })));
          console.log("JWT_PUBLIC_KEY_B64=" + b(publicKey.export({ type: "spki", format: "pem" })));
          console.log("TOTP_ENC_KEY=" + c.randomBytes(32).toString("base64"));
          ' >> "$GITHUB_ENV"
      - run: npm run build -w apps/api # construit aussi le paquet partagé et le client Prisma
      - run: npm run db:deploy -w apps/api
      - run: npm run db:seed -w apps/api
      - run: npm run build -w apps/web
      - name: Lancement de l'API et du site
        run: |
          (cd apps/api && NODE_ENV=production node dist/main.js > ../../api.log 2>&1 &) # comme en production
          (npm run start -w apps/web -- -p 3000 > web.log 2>&1 &)
          npm run wait:servers
      - run: npm run e2e:install -w apps/web
      - run: npm run e2e -w apps/web # TE, TA (axe-core), TS, TC01 sur 3 moteurs + mobile
      - run: npm run lighthouse # Lighthouse : seuils SEO, accessibilité, bonnes pratiques
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rapports-e2e
          path: |
            apps/web/playwright-report
            apps/web/test-results
            api.log
            web.log
            .lighthouseci
          retention-days: 7
