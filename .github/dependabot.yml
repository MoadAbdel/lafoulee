version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    # Délai avant de proposer une version toute neuve : un paquet piégé est souvent retiré en quelques jours.
    cooldown: { default-days: 3 }
    groups:
      correctifs:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
